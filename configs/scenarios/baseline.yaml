name: baseline
description: "Standard balanced scenario replicating seed.py ground truth plus streaming transactions"
version: "2.0"

# Keys (shared by all scenarios):
#   simulation.target_event_rate      benign events per simulated second (the live "rate" control)
#   simulation.heavy_tail_alpha       Pareto shape for per-user activity (lower = heavier tail)
#   simulation.benign_mix             relative weights of benign event kinds
#   simulation.user_join_rate / user_leave_rate   benign churn, users per simulated second
#   simulation.hub_distribution       named benign hubs {name: {type, size, category, fill_time_s}}
#   simulation.hub_size_distribution  extra random hubs with Pareto-distributed sizes
#   simulation.drift                  mid-run change of benign behaviour
#   rings                             scheduled rings; for hub_hiding, shared_attribute names a hub
#   random_rings                      Poisson process spawning rings at random times
#   adaptive_attacker                 strategy re-weighting for rings with evasion: adaptive

simulation:
  duration_seconds: 60
  target_event_rate: 10.0
  num_users: 30
  num_devices: 18
  num_cards: 18
  num_ips: 20
  heavy_tail_alpha: 2.5
  user_join_rate: 0.05
  user_leave_rate: 0.0
  hub_distribution:
    office_wifi:
      size: 12
      type: "ip"
      category: office
    carrier_nat:
      size: 8
      type: "ip"
      category: carrier_nat

rings:
  - id: ring_a
    type: shared_device
    size: 4
    shared_attribute: "device_007"
    spawn_time_s: 5
    evasion: none
  - id: ring_b
    type: shared_card
    size: 3
    shared_attribute: "card_005"
    spawn_time_s: 15
    evasion: none
  - id: ring_c
    type: shared_ip
    size: 3
    shared_attribute: "ip_004"
    spawn_time_s: 25
    evasion: none
  - id: ring_cycle
    type: money_cycle
    size: 3
    length: 3
    spawn_time_s: 35
    evasion: none
