name: hub_heavy
description: "Dense benign hubs scenario testing whether rings hiding behind dense hubs can be recovered"
version: "1.0"

simulation:
  duration_seconds: 60
  target_event_rate: 25.0
  num_users: 100
  num_devices: 40
  num_cards: 50
  num_ips: 30
  benign_txn_rate: 1.0
  heavy_tail_alpha: 2.0
  hub_distribution:
    mega_office_gateway:
      size: 50
      type: "ip"
    public_vpn_endpoint:
      size: 35
      type: "ip"
    store_kiosk:
      size: 20
      type: "device"

rings:
  - id: ring_in_hub
    type: shared_ip
    size: 4
    shared_attribute: "ip_hub_mega"
    spawn_time_s: 12
    evasion: hub_hiding
  - id: standard_ring
    type: shared_card
    size: 3
    shared_attribute: "card_hub_sec"
    spawn_time_s: 25
    evasion: none
